<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaccine Directory — VaxaGuard</title>
  <meta name="description" content="Verified encyclopedia of childhood, adult, and senior immunization schedules and clinical guidance.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#F0F9FF', 100: '#E0F2FE', 600: '#0284C7', 700: '#0369A1' },
            navy: { 800: '#1E293B', 900: '#0F172A' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">

  <div id="toast-container"></div>
  <div id="sidebar-container"></div>

  <div class="lg:pl-[260px] flex flex-col min-h-screen pb-16 lg:pb-0">
    <div id="topbar-container"></div>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight font-['Outfit']">
            Vaccine Directory
          </h1>
          <p class="text-sm text-slate-500 mt-0.5">Official clinical guidance & immunization schedule reference.</p>
        </div>

        <div class="text-xs text-slate-500 bg-white px-3.5 py-2 rounded-xl border border-slate-200 shadow-xs flex items-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
          <span>UIP India & IAP Pediatric Standard</span>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="bg-white rounded-3xl p-5 card-shadow border border-slate-100 flex flex-wrap items-center justify-between gap-4">
        <!-- Age Group Filter Buttons -->
        <div class="inline-flex p-1 rounded-2xl bg-slate-100 text-xs overflow-x-auto">
          <button data-group="all" class="vac-filter-btn px-4 py-2 font-bold rounded-xl transition-all bg-white text-slate-900 shadow-xs">
            All Vaccines
          </button>
          <button data-group="child" class="vac-filter-btn px-4 py-2 font-semibold text-slate-600 hover:text-slate-900 rounded-xl transition-all">
            Children (0–17)
          </button>
          <button data-group="adult" class="vac-filter-btn px-4 py-2 font-semibold text-slate-600 hover:text-slate-900 rounded-xl transition-all">
            Adults (18–59)
          </button>
          <button data-group="senior" class="vac-filter-btn px-4 py-2 font-semibold text-slate-600 hover:text-slate-900 rounded-xl transition-all">
            Seniors (60+)
          </button>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full sm:w-72">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input type="text" id="vac-search-input"
            class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500"
            placeholder="Search by vaccine or disease...">
        </div>
      </div>

      <!-- Vaccine Cards Grid -->
      <div id="vaccine-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full p-12 text-center text-slate-400 text-xs">
          <span class="animate-spin inline-block w-4 h-4 border-2 border-sky-500 border-t-transparent rounded-full mr-2"></span>
          Loading vaccine directory...
        </div>
      </div>
    </main>

    <div id="mobile-nav-container"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/vaccines.js"></script>
</body>
</html>
