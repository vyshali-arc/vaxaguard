<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaccination Records & Certificates — VaxaGuard</title>
  <meta name="description" content="Official immunization history, clinic certificates, and verified records.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#F0F9FF', 100: '#E0F2FE', 600: '#0284C7', 700: '#0369A1' },
            navy: { 800: '#1E293B', 900: '#0F172A' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">

  <div id="toast-container"></div>
  <div id="sidebar-container"></div>

  <div class="lg:pl-[260px] flex flex-col min-h-screen pb-16 lg:pb-0">
    <div id="topbar-container"></div>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight font-['Outfit']">
            Vaccination Records
          </h1>
          <p class="text-sm text-slate-500 mt-0.5">View, filter, and export verified immunization history.</p>
        </div>

        <div class="flex items-center gap-3">
          <button id="records-download-pdf-btn"
            class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl text-xs font-semibold shadow-xs flex items-center gap-2 transition-all">
            <i data-lucide="download" class="w-4 h-4 text-sky-600"></i>
            <span>Download PDF</span>
          </button>
          <button onclick="Components.openRecordModal({}, () => loadRecords())"
            class="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs shadow-md shadow-sky-600/20 hover:shadow-lg transition-all flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>+ Add Record</span>
          </button>
        </div>
      </div>

      <!-- Filters Row (Matching Mockup Panel 8) -->
      <div class="bg-white rounded-3xl p-5 card-shadow border border-slate-100 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-4">
          <!-- Member Selector -->
          <div class="flex items-center gap-2">
            <label for="filter-member-select" class="text-xs font-bold text-slate-700">Select Member:</label>
            <select id="filter-member-select"
              class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-sky-500/20">
              <option value="">All Members</option>
            </select>
          </div>

          <!-- Verification Status Filter -->
          <div class="flex items-center gap-2">
            <label for="filter-verification-select" class="text-xs font-bold text-slate-700">Verification:</label>
            <select id="filter-verification-select"
              class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-sky-500/20">
              <option value="all">All Records</option>
              <option value="verified_by_doctor">Doctor Verified</option>
              <option value="self_reported">Self Reported</option>
            </select>
          </div>
        </div>

        <!-- Search Input -->
        <div class="relative w-full sm:w-64">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input type="text" id="record-search-input"
            class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500"
            placeholder="Search vaccine, clinic...">
        </div>
      </div>

      <!-- Records Table Card (Matching Mockup Panel 8) -->
      <div class="bg-white rounded-3xl p-6 sm:p-7 card-shadow border border-slate-100 space-y-4">
        <div class="overflow-x-auto rounded-2xl border border-slate-100">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                <th class="py-3.5 px-4">Vaccine</th>
                <th class="py-3.5 px-3">Dose</th>
                <th class="py-3.5 px-3">Date Given</th>
                <th class="py-3.5 px-3">Clinic / Doctor</th>
                <th class="py-3.5 px-3">Person</th>
                <th class="py-3.5 px-3">Status</th>
                <th class="py-3.5 px-4 text-right">Certificate</th>
              </tr>
            </thead>
            <tbody id="records-table-body" class="divide-y divide-slate-100">
              <tr>
                <td colspan="7" class="p-8 text-center text-slate-400">
                  <span class="animate-spin inline-block w-4 h-4 border-2 border-sky-500 border-t-transparent rounded-full mr-2"></span>
                  Loading immunization records...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="mobile-nav-container"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
